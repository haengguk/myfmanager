plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lolfm'
version = '0.0.1-SNAPSHOT'
description = 'LoL FM backend MVP'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'diagnostic'
    }
    maxHeapSize = '2g'
}

tasks.register("runRealMatchPerformanceBaselineV1", Test) {
    group = "verification"
    description = "Captures the two-fixture Real Match V1 performance baseline in one fresh JVM."
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags "real-match-performance-baseline-v1"
    }
    maxHeapSize = "3g"
    maxParallelForks = 1
    failFast = true
    outputs.upToDateWhen { false }
    systemProperty "lolfm.gradleVersion", gradle.gradleVersion
    reports.html.outputLocation = layout.buildDirectory.dir(
            "reports/tests/realMatchPerformanceBaselineV1")
    reports.junitXml.outputLocation = layout.buildDirectory.dir(
            "test-results/realMatchPerformanceBaselineV1")
}

