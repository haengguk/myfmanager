plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lolfm'
version = '0.0.1-SNAPSHOT'
description = 'LoL FM backend MVP'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('runBountyDiagnostics', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lolfm.simulator.BountyDiagnosticRunner'
}


tasks.register('runPositionEconomyDiagnostics', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lolfm.simulator.PositionEconomyDiagnostics'
