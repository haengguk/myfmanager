tasks.register("runProgressionBaselineAudit", JavaExec) {
    group = "verification"
    description = "Runs the 12.5 progression balance baseline audit."
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.lolfm.simulator.ProgressionBaselineAudit"
}
