tasks.register("generatePreJungleRuntimeBaseline", JavaExec) {
    group = "verification"
    description = "Refuses regeneration of the immutable Pre-Jungle V1 artifact."
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.lolfm.application.PreJungleBaselineV2Generator"
    doFirst {
        throw new GradleException(
                "PRE_JUNGLE_RUNTIME_BASELINE_V1 is immutable; use generatePreJungleRuntimeBaselineV2.")
    }
}

tasks.register("generatePreJungleRuntimeBaselineV2", JavaExec) {
    group = "verification"
    description = "Generates the immutable Random-aware Pre-Jungle V2 baseline after a clean full regression."
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.lolfm.application.PreJungleBaselineV2Generator"
    outputs.upToDateWhen { false }
    doFirst {
        String regressionStatus = providers.gradleProperty(
                "baselineFullRegressionStatus").getOrElse("UNCONFIRMED")
        String sourceRevision = providers.gradleProperty(
                "baselineSourceRevision").getOrElse("")
        if (regressionStatus != "CLEAN_PASS") {
            throw new GradleException(
                    "Use -PbaselineFullRegressionStatus=CLEAN_PASS only after the final full regression passes.")
        }
        if (sourceRevision.isBlank()) {
            throw new GradleException("-PbaselineSourceRevision is required.")
        }
        systemProperty "lolfm.baseline.fullRegressionStatus", regressionStatus
        systemProperty "lolfm.baseline.sourceRevision", sourceRevision
    }
}

