spring.application.name=lolfm-backend
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=8KB
lolmanager.runtime-dir=${LOLMANAGER_RUNTIME_DIR:${user.home}/.lolmanager/runtime}
spring.datasource.url=${LOLMANAGER_LEAGUE_DB_URL:jdbc:h2:file:${lolmanager.runtime-dir}/league-db/lolmanager-league-v1;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${LOLMANAGER_LEAGUE_DB_USERNAME:sa}
spring.datasource.password=${LOLMANAGER_LEAGUE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
# Existing bounded repositories are final package-scoped classes. JdbcTemplate already
# translates SQL exceptions, so a second @Repository CGLIB translation layer is disabled.
spring.dao.exceptiontranslation.enabled=false
